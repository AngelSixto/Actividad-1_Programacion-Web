<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones con Arreglos</title>
    <link rel="stylesheet" href="css/ejercicio14.css">
</head>
<body>

    <div class="contenedor">
        <h2>Analizador de Números</h2>
        
        <form id="formArreglos">
            <div class="grupo">
                <label for="numerosInput">Ingresa números separados por comas:</label>
                <input type="text" id="numerosInput" placeholder="Ej. 10, 20, 30, 40, 50">
                <span id="mensajeError" class="error"></span>
            </div>

            <button type="button" onclick="procesarNumeros()">Calcular</button>

            <div class="grupo">
                <label for="numMayor">Número mayor:</label>
                <input type="text" id="numMayor" readonly placeholder="-">
            </div>

            <div class="grupo">
                <label for="numMenor">Número menor:</label>
                <input type="text" id="numMenor" readonly placeholder="-">
            </div>

            <div class="grupo">
                <label for="promedio">Promedio:</label>
                <input type="text" id="promedio" readonly placeholder="-">
            </div>
        </form>
    </div>

    <script src="js/ejercicio14.js"></script>
</body>
</html>
