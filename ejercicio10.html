<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celsius a Fahrenheit</title>
<link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>

  <div class="tarjeta">
    <h1 class="titulo">Celsius a Fahrenheit</h1>
    <p class="subtitulo">Ingresa una temperatura en grados Celsius y conviértela al instante.</p>

    <div class="campo">
      <label for="celsius">Temperatura en Celsius</label>
      <div class="entrada-envoltorio">
        <input type="text" id="celsius" placeholder="Ej. 25" inputmode="decimal">
        <span class="unidad">°C</span>
      </div>
    </div>

    <p class="error" id="mensajeError"></p>

    <div class="campo">
      <label for="resultado">Resultado en Fahrenheit</label>
      <div class="entrada-envoltorio">
        <input type="text" id="resultado" readonly placeholder="—">
        <span class="unidad">°F</span>
      </div>
    </div>

    <button onclick="convertir()">Convertir</button>

    <p class="formula">F = (C × 9/5) + 32</p>
  </div>

<script src="js/ejercicio10.js"></script>
</body>
</html>
