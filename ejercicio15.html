<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15 - Registro de Estudiantes</title>
    <link rel="stylesheet" href="css/ejercicio15.css">
</head>
<body>

    <div class="contenedor">
        <h2>Gestión de Estudiantes</h2>
        
        <form id="formEstudiantes">
            <div class="grupo">
                <label for="nombreInput">Nombre del estudiante:</label>
                <input type="text" id="nombreInput" placeholder="Ej. Ana">
            </div>

            <div class="grupo">
                <label for="calificacionInput">Calificación:</label>
                <input type="number" id="calificacionInput" min="0" max="100" step="any" placeholder="Ej. 92">
            </div>

            <span id="mensajeError" class="error"></span>

            <div class="botones">
                <button type="button" class="btn-agregar" onclick="agregarEstudiante()">Agregar estudiante</button>
                <button type="button" class="btn-calcular" onclick="calcularResultados()">Calcular</button>
            </div>

            <p id="totalRegistrados" class="info-registrados">Estudiantes agregados: 0</p>

            <div class="grupo">
                <label for="promedio">Calificación promedio:</label>
                <input type="text" id="promedio" readonly placeholder="-">
            </div>

            <div class="grupo">
                <label for="masAlta">Estudiante con calificación más alta:</label>
                <input type="text" id="masAlta" readonly placeholder="-">
            </div>

            <div class="grupo">
                <label for="masBaja">Estudiante con calificación más baja:</label>
                <input type="text" id="masBaja" readonly placeholder="-">
            </div>
        </form>
    </div>

    <script src="js/ejercicio15.js"></script>
</body>
</html>
