<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16 - Calculadora con Funciones Flecha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="css/ejercicio16.css">
</head>
<body>

    <div class="contenedor">
        <h2>Calculadora Básica</h2>
        
        <form id="formCalculadora">
            <div class="grupo">
                <label for="numero1">Número 1:</label>
                <input type="text" id="numero1" placeholder="Ej. 10">
            </div>

            <div class="grupo">
                <label for="numero2">Número 2:</label>
                <input type="text" id="numero2" placeholder="Ej. 5">
            </div>

            <!-- Botones de Operaciones -->
            <div class="grid-botones">
                <button type="button" onclick="calcularOperacion('suma')">Suma (+)</button>
                <button type="button" onclick="calcularOperacion('resta')">Resta (-)</button>
                <button type="button" onclick="calcularOperacion('multiplicacion')">Multiplicación (×)</button>
                <button type="button" onclick="calcularOperacion('division')">División (÷)</button>
            </div>

            <!-- Caja de resultado readonly -->
            <div class="grupo">
                <label for="resultado">Resultado:</label>
                <input type="text" id="resultado" readonly placeholder="-">
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/ejercicio16.js"></script>
</body>
</html>
